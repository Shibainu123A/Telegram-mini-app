<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Telegram App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--tg-theme-bg-color, #f4f4f4);
      color: var(--tg-theme-text-color, #111);
    }

    .app {
      max-width: 480px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 25px 10px;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 50%;
      background: #2481cc;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
    }

    h1 {
      margin: 15px 0 5px;
    }

    .username {
      opacity: 0.65;
    }

    .balance {
      margin-top: 20px;
      padding: 22px;
      border-radius: 18px;
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      text-align: center;
    }

    .balance-title {
      opacity: 0.7;
      font-size: 14px;
    }

    .points {
      font-size: 34px;
      font-weight: bold;
      margin-top: 8px;
    }

    .card {
      margin-top: 15px;
      padding: 18px;
      border-radius: 16px;
      background: var(--tg-theme-secondary-bg-color, #ffffff);
    }

    .card h3 {
      margin-top: 0;
    }

    button {
      width: 100%;
      border: 0;
      padding: 14px;
      margin-top: 10px;
      border-radius: 12px;
      background: #2481cc;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .info {
      text-align: center;
      margin-top: 20px;
      opacity: 0.6;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo">T</div>

      <h1>My Telegram App</h1>

      <div class="username" id="userName">
        Loading user...
      </div>
    </div>

    <div class="balance">
      <div class="balance-title">Your Balance</div>
      <div class="points" id="balance">0</div>
    </div>

    <div class="card">
      <h3>👤 Telegram Profile</h3>

      <p>
        <b>Name:</b>
        <span id="name">Loading...</span>
      </p>

      <p>
        <b>Username:</b>
        <span id="username">Loading...</span>
      </p>

      <p>
        <b>Telegram ID:</b>
        <span id="telegramId">Loading...</span>
      </p>
    </div>

    <div class="card">
      <h3>🎁 Earn Rewards</h3>

      <p>Complete tasks and earn rewards.</p>

      <button onclick="earnPoints()">
        🎯 Earn 100 Points
      </button>
    </div>

    <div class="card">
      <h3>👥 Referral</h3>

      <p>Invite your friends and earn rewards.</p>

      <button onclick="showReferral()">
        🔗 My Referral Link
      </button>
    </div>

    <div class="info">
      Telegram Mini App
    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user) {

      const fullName =
        ((user.first_name || "") + " " + (user.last_name || "")).trim();

      document.getElementById("name").textContent =
        fullName || "Telegram User";

      document.getElementById("username").textContent =
        user.username ? "@" + user.username : "Not available";

      document.getElementById("telegramId").textContent =
        user.id;

      document.getElementById("userName").textContent =
        user.username ? "@" + user.username : fullName;

    } else {

      document.getElementById("name").textContent =
        "Open this app inside Telegram";

      document.getElementById("username").textContent =
        "-";

      document.getElementById("telegramId").textContent =
        "-";

      document.getElementById("userName").textContent =
        "Telegram Mini App";
    }

    let balance = 0;

    function earnPoints() {

      balance += 100;

      document.getElementById("balance").textContent =
        balance;

      tg.HapticFeedback?.notificationOccurred("success");

    }

    function showReferral() {

      if (!user) {
        tg.showAlert("Please open this app inside Telegram.");
        return;
      }

      const botUsername = "YOUR_BOT_USERNAME";

      const referralLink =
        "https://t.me/" +
        botUsername +
        "?start=ref_" +
        user.id;

      tg.showPopup({
        title: "Referral Link",
        message: referralLink,
        buttons: [
          {
            id: "ok",
            type: "ok",
            text: "OK"
          }
        ]
      });

    }
  </script>

</body>
</html>
